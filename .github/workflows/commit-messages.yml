name: Commit messages

# Reusable check for the product repositories. Each commit of a pull request
# becomes a line of the "What is new" list on System > Update, so its first line
# must read "Area: what changed". The rules are scripts/commit_messages.py in
# freesense-os-base (docs/commit-messages.md there), so this check and the release
# notes read commit messages the same way. Call it from a pull_request workflow:
#
#   jobs:
#     commit-messages:
#       uses: FreeSense-org/.github/.github/workflows/commit-messages.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the commit-message rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: FreeSense-org/freesense-os-base
          ref: main
          path: .rules
          sparse-checkout: scripts/commit_messages.py
          persist-credentials: false
      - name: Check the commits of this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "This check runs on pull requests only." >&2
            exit 1
          fi
          python3 .rules/scripts/commit_messages.py --range "${BASE_SHA}..${HEAD_SHA}"
